// ============================================================ squash: a sprite pressed to s of its height, bulging sideways
// wm = how much wider the middle rows get; base = how much of that the top / bottom rows get too
function drawSquash(c, cx, by, s, wm, base) {

    const w = Math.max(1, R(w0 * (1 + A * (base + (1 - base) * Math.sin(Math.PI * t)))));

// pressure (tons) -> height left, piecewise linear
function curveAt(pts, p) {
  if (p <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (p <= pts[i][0]) { const [p0, s0] = pts[i - 1], [p1, s1] = pts[i]; return s0 + (s1 - s0) * (p - p0) / (p1 - p0); }

}

const wait = ms => new Promise(r => setTimeout(r, ms));
function lbSession(force) {   // short-lived token from the parent player, kept in memory only
  if (!ON_PLATFORM || window.parent === window) return Promise.resolve(null);
  if (!force && lb.token && Date.now() < lb.exp - 30000) return Promise.resolve(lb);
  if (lb.asking) return lb.asking;
  return lb.asking = new Promise(res => {
    const requestId = uuid();
    const done = v => { window.removeEventListener('message', on); clearTimeout(to); lb.asking = null; res(v); };
    const on = e => {
      const m = e.data;
      if (e.source !== window.parent || !PLATFORM_ORIGINS.includes(e.origin) || !m || m.source !== 'aimadegames-platform' || m.type !== 'leaderboard-session' || m.requestId !== requestId) return;
      if (!m.session || m.apiOrigin !== e.origin) { done(null); return; }
      lb.token = m.session.token; lb.origin = e.origin; lb.exp = Date.parse(m.session.expiresAt) || Date.now() + 600000; done(lb);
    };
    window.addEventListener('message', on);
    const to = setTimeout(() => done(null), 15000);
    for (const o of PLATFORM_ORIGINS) try { window.parent.postMessage({ source: 'aimadegames', type: 'leaderboard-session', requestId }, o); } catch (e) {}
  });
}
async function lbPost(path, body, key) {
  const res = await fetch(lb.origin + path, { method: 'POST', credentials: 'omit', body: body ? JSON.stringify(body) : undefined,
    headers: Object.assign({ Authorization: 'Bearer ' + lb.token, 'Idempotency-Key': key }, body ? { 'Content-Type': 'application/json' } : {}) });
  if (res.status === 401) { lb.token = null; return { retry: 0 }; }

}
// one run per new best: start it and settle it right away; retries keep the same keys, run and score
async function boardSubmit(boardId, score) {
  const k1 = uuid(), k2 = uuid(); let runId = null;
  for (let attempt = 0; attempt < 6; attempt++) {
    if (!(await lbSession(!lb.token))) return null;
    try {
      if (!runId) { const r = await lbPost('/api/v1/leaderboards/' + boardId + '/runs', null, k1); if (r.retry !== undefined) { await wait(r.retry); continue; } if (!r.ok) return null; runId = r.data.runId; }
      const r = await lbPost('/api/v1/runs/' + runId + '/score', { score }, k2);
      if (r.retry !== undefined) { await wait(r.retry); continue; }
      return r.ok ? r.data : null;
    } catch (e) { await wait(2000 * (attempt + 1)); }

}
function boardScore(name, score) {   // remember the newest best; a short wait merges bursts (several new things in a row)
  if (!ON_PLATFORM || !cloud.ready || !(score > (lb.sent[name] || 0))) return;
  lb.want[name] = score; clearTimeout(lb.timer); lb.timer = setTimeout(boardFlush, 3000);
}
async function boardFlush() {
  if (lb.busy) { lb.timer = setTimeout(boardFlush, 3000); return; }
  lb.busy = true;
  try {
    for (const name of Object.keys(lb.want)) {
      const score = lb.want[name]; delete lb.want[name];
      const r = await boardSubmit(BOARDS[name], score);
      if (!r) continue;
      lb.sent[name] = Math.max(lb.sent[name] || 0, score);
      if (r.isPersonalBest && r.rank) pop((name === 'collection' ? '图鉴榜' : '高价榜') + ' 第 ' + r.rank + ' 名', 120, 28, '#7fe08a', 8, 2.5);
    }
  } catch (e) {} finally { lb.busy = false; }
}
function syncBoards() { boardScore('collection', seenCount()); boardScore('price', topPrice); }   // after the save is loaded

requestAnimationFrame(frame);
